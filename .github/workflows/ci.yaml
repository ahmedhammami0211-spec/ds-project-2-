name: CI/CD Pipeline

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, develop]
jobs:
  test:
    name: Test HTML/CSS Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Check HTML file exists
        run: |
          if [ -f index.html ]; then
            echo "✅ index.html found"
          else
            echo "❌ index.html not found"
            exit 1
          fi

      - name: Check CSS file exists
        run: |
          if [ -f style.css ]; then
            echo "✅ style.css found"
          else
            echo "❌ style.css not found"
            exit 1
          fi

      - name: Check JS file exists
        run: |
          if [ -f script.js ]; then
            echo "✅ script.js found"
          else
            echo "❌ script.js not found"
            exit 1
          fi

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build Docker image
        run: docker build -t ds2-website .

      - name: Verify image was created
        run: docker images ds2-website